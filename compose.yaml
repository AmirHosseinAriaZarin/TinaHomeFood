services:
  postgres:
    image: 'postgres:16'
    container_name: tina-postgres
    environment:
      - 'POSTGRES_USER=develop'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_DB=tinaDB'
    ports:
      - '5432:5432'
    volumes:
      - tina-postgres-data:/var/lib/postgresql/data

volumes:
  tina-postgres-data: